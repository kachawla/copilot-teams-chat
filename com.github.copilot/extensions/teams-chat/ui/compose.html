<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teams message</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
</head>
<body>
    <main>
        <header>
            <h1>Teams message</h1>
        </header>

        <form id="compose" autocomplete="off">
            <label class="field">
                <span class="label">To</span>
                <input id="to" type="text" list="contacts" placeholder="Email addresses or saved contact names, separated by semicolons">
                <datalist id="contacts"></datalist>
            </label>

            <label id="topic-field" class="field" hidden>
                <span class="label">Group chat name <span class="muted">(used if the group chat is new)</span></span>
                <input id="topic" type="text" maxlength="250">
            </label>

            <div class="field">
                <div class="row spread">
                    <label for="message" class="label">Message</label>
                    <select id="format" aria-label="Message format">
                        <option value="markdown">Markdown</option>
                        <option value="text">Plain text</option>
                    </select>
                </div>
                <textarea id="message" rows="8" placeholder="Write your message"></textarea>
            </div>

            <div class="field">
                <span class="label">What Teams will show</span>
                <div id="preview" class="preview plain" aria-live="polite"></div>
            </div>

            <div class="row actions">
                <button id="open" type="submit" class="primary">Open in Teams</button>
                <span id="status" class="muted" role="status"></span>
            </div>
            <p class="muted">Teams opens with the message ready. Nothing is sent until you press Send in Teams.</p>
            <p id="error" class="error" hidden></p>
            <p id="result" class="success" hidden></p>
        </form>
    </main>
</body>
</html>
